# PrismOS-AI CI — Type-check, lint, test, and verify on every push / PR

name: CI

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Push-triggered CI is defense in depth only: Git objects have already
  # reached GitHub before this job starts. The local pre-push hook is the
  # preventive gate; this job verifies every commit in the delivered range.
  public-boundary:
    name: Public Repository Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Explain post-push boundary
        run: echo "Defense in depth only — push CI runs after repository objects reach GitHub."

      - name: Scan every commit/tag snapshot in the delivered range
        env:
          PRISMOS_RANGE_BEFORE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          PRISMOS_RANGE_AFTER: ${{ github.event_name == 'push' && github.event.after || github.event.pull_request.head.sha }}
          PRISMOS_SNAPSHOT_REF: ${{ github.ref }}
          PRISMOS_DESTINATION_REMOTE: origin
        run: bash scripts/check-public-range.sh "$PRISMOS_RANGE_BEFORE" "$PRISMOS_RANGE_AFTER"

  # ── Frontend: TypeScript + Vitest ──────────────────────────────
  frontend:
    name: Frontend (TypeScript + Vitest)
    needs: public-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run Vitest tests
        run: npx vitest run --reporter=verbose

      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=high

  # ── Backend: Rust cargo check + clippy + tests ─────────────────
  backend:
    name: Backend (Rust)
    needs: public-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libasound2-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev clang

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: Cargo clippy (lint)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked --lib

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Enforce Cargo advisory baseline
        run: python3 scripts/check-cargo-audit.py

  # ── Build verification (ensures production build compiles) ─────
  build-check:
    name: Build Verification
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libasound2-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev clang

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify Tauri build compiles
        working-directory: src-tauri
        run: cargo build --release --locked
