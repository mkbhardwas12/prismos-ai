# PrismOS-AI Cross-Platform Release Build
# Builds Windows (.msi, .exe), macOS (.dmg, .app), Linux (.deb, .AppImage), and Android (.apk)
# Triggered on version tags or manual dispatch

name: 'Release Build'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.5.0)'
        required: false
        default: 'draft'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # Desktop builds (Windows, macOS, Linux)
  # ──────────────────────────────────────────────
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles msi,nsis'
            rust-targets: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'
            rust-targets: 'aarch64-apple-darwin'
          # macos-13 (Intel hardware) retired Dec 2025. Cross-compile x64 from Apple Silicon.
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles dmg'
            rust-targets: 'x86_64-apple-darwin'
          # 22.04 PipeWire headers do not match crates.io libspa 0.9.2
          # (missing spa_video_info_raw.flags). 24.04 is what CI already tests.
          - platform: 'ubuntu-24.04'
            args: '--bundles appimage,deb'
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            clang

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.version || 'draft' }}
          releaseName: "PrismOS-AI ${{ github.ref_name || inputs.version || 'draft' }}"
          releaseBody: |
            ## PrismOS-AI v0.6.0

            Desktop AI that runs on your laptop. Drop a file, ask a question, it remembers. Nothing leaves the machine.

            ### Downloads

            List only assets actually attached to this tag. Do not mark latest
            until docs/V06_LAUNCH_GATE.md is green.

            Expected names when the matrix succeeds:
            - Windows x64: `.msi` / `.exe`
            - macOS Apple Silicon: `*_aarch64.dmg`
            - macOS Intel: `*_x64.dmg`
            - Linux x64: `.AppImage` / `.deb` (ubuntu-24.04)

            Linux ARM AppImages are not published. Build from source or use x64.

            ### Requirements
            - [Ollama](https://ollama.com) with a local model (`ollama pull qwen3:4b`)

            See [CHANGELOG.md](https://github.com/mkbhardwas12/prismos-ai/blob/main/CHANGELOG.md) and [docs/V06_LAUNCH_GATE.md](https://github.com/mkbhardwas12/prismos-ai/blob/main/docs/V06_LAUNCH_GATE.md).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ──────────────────────────────────────────────
  # Android build
  # ──────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;29.0.13846066"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android
        run: npx tauri android init

      - name: Build Android APK
        run: npx tauri android build --apk -- --features vendored-ssl
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: prismos-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          tag_name: ${{ github.ref_name }}
          draft: true
