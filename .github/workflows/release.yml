# PrismOS-AI manual candidate-artifact build.
#
# This workflow deliberately DOES NOT create or update a GitHub Release. Current
# packages are unsigned/unnotarized. The current Cargo audit reports zero known
# vulnerabilities and 19 reviewed maintenance/unsound warnings, but the audit is
# still a mandatory candidate gate: any vulnerability or unexpected warning
# change requires review. A future release job must consume these read-only build
# outputs only after independent signing, notarization, checksum/SBOM generation,
# and human approval.

name: Candidate Artifacts (Manual, Unpublished)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version label (for artifact names only)
        required: true
        default: draft

permissions:
  contents: read

concurrency:
  group: candidate-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Tests and security gates
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Enforce public repository boundary
        run: bash scripts/check-public-boundary.sh --treeish "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libasound2-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev clang

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Frontend type-check and tests
        run: |
          npm exec tsc -- --noEmit
          npm test -- --run

      - name: Runtime and build dependency audit
        run: npm audit --audit-level=high

      - name: Rust check, tests, and lint
        working-directory: src-tauri
        run: |
          cargo check --locked --all-targets
          cargo test --locked --lib
          cargo clippy --locked --all-targets -- -D warnings

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Rust dependency audit (release blocking)
        run: python3 scripts/check-cargo-audit.py

  build-desktop:
    name: Unsigned ${{ matrix.label }} candidate
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
            args: ""
            bundle-path: src-tauri/target/release/bundle/**
          - platform: macos-15
            label: macos-arm64
            args: --target aarch64-apple-darwin
            bundle-path: src-tauri/target/aarch64-apple-darwin/release/bundle/**
          - platform: macos-15-intel
            label: macos-x64
            args: --target x86_64-apple-darwin
            bundle-path: src-tauri/target/x86_64-apple-darwin/release/bundle/**
          - platform: ubuntu-22.04
            label: linux-x64
            args: ""
            bundle-path: src-tauri/target/release/bundle/**

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout exact source revision without credentials
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libasound2-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev clang

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build unsigned candidate bundle
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Upload immutable workflow artifact (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prismos-${{ inputs.version }}-${{ matrix.label }}-UNSIGNED
          path: ${{ matrix.bundle-path }}
          if-no-files-found: error
          retention-days: 14
