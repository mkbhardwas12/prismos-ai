[package]
name = "prismos"
version = "0.5.2"
description = "PrismOS-AI — local-first desktop assistant with bounded sequential workflows"
authors = ["PrismOS-AI Contributors"]
edition = "2021"
default-run = "prismos"

[lib]
name = "prismos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Standalone CLI for headless / dev use — talks directly to local Ollama.
# Build:  cargo build --release --bin prismos-cli
# Run:    ./target/release/prismos-cli ask "your question"
[[bin]]
name = "prismos-cli"
path = "src/bin/prismos_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup", "serialize"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
aes-gcm = "0.10"
getrandom = "0.2"
zeroize = "1"
futures-util = "0.3"
thiserror = "1"
tauri-plugin-global-shortcut = "2.3.1"

# Phase 4 — File Indexing prototype support
notify = "6.1"
walkdir = "2"
dirs = "6"
tauri-plugin-window-state = "2.4.1"

# Bounded document ingest and generation
docx-rs = "0.4"
zip = "8.6"

# Calendar Keeper — Local .ics calendar integration
ical = "0.11"

# System Info — Hardware detection for model recommendations
sysinfo = "0.30"

# Vendored OpenSSL for Android cross-compilation
openssl = { version = "0.10", features = ["vendored"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
vendored-ssl = ["openssl"]
